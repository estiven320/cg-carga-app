# =============================================================================
# CG CARGA TMS - Infraestructura local (100% open source, licencia $0)
#
#   postgis    PostgreSQL 16 + PostGIS 3.4
#   minio      almacenamiento S3 self-hosted para las fotos POD
#   evolution  gateway de WhatsApp Web (alternativa: Baileys embebido en el API)
#   nominatim  (perfil "geocoder") instancia propia de Nominatim: elimina el
#              limite de 1 req/s. Requiere ~8 GB de RAM y varias horas de import
#              para Colombia, por eso queda opt-in.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml --profile geocoder up -d
# =============================================================================

name: cgcarga-tms

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: cgcarga-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: cgcarga
      POSTGRES_PASSWORD: cgcarga
      POSTGRES_DB: cgcarga
    ports:
      - '5432:5432'
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cgcarga -d cgcarga']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: cgcarga-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cgcarga
      MINIO_ROOT_PASSWORD: cgcarga-secret
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10

  # Crea el bucket de POD en el primer arranque y lo deja privado: las fotos
  # solo se sirven mediante URLs prefirmadas emitidas por el API.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cgcarga cgcarga-secret &&
      mc mb --ignore-existing local/pod &&
      mc anonymous set none local/pod &&
      echo 'Bucket pod listo'
      "

  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: cgcarga-evolution
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: cambiar-en-produccion
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://cgcarga:cgcarga@postgis:5432/evolution
      CONFIG_SESSION_PHONE_CLIENT: CG CARGA TMS
    ports:
      - '8080:8080'
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - evolution-instances:/evolution/instances

  # Nominatim propio: opcional pero recomendado cuando el volumen diario supera
  # unas pocas cientos de direcciones nuevas.
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: cgcarga-nominatim
    profiles: ['geocoder']
    restart: unless-stopped
    environment:
      PBF_URL: https://download.geofabrik.de/south-america/colombia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/south-america/colombia-updates/
      IMPORT_WIKIPEDIA: 'false'
      NOMINATIM_PASSWORD: cgcarga
    ports:
      - '8081:8080'
    shm_size: 1gb
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main

volumes:
  postgis-data:
  minio-data:
  evolution-instances:
  nominatim-data:
