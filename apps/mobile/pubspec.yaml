name: cgcarga_driver
description: App de conductores CG CARGA - rutas, entregas y evidencia fotografica (POD)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # Mapa con los mismos tiles de OpenStreetMap que usa el dashboard: sin API key.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  # Cola offline: el conductor pierde senal en bodegas y zonas industriales.
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  crypto: ^3.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
